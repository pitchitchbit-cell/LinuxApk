name: Otomatik Linux APK Derleyici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # GitHub panelinden tek tıkla manuel başlatma desteği

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Java (JDK 17) Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Android Ortamını Hazırla
      uses: android-actions/setup-android@v3

    - name: Otomatik Proje İskeleti ve Linux Dosyalarını Oluştur
      run: |
        # 1. Temel Android Proje Yapısını Oluştur
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/java/com/linux/app

        # 2. PRoot (ARM64) dosyasını doğrudan indir ve jniLibs içine at
        echo "PRoot indiriliyor..."
        curl -L -o app/src/main/jniLibs/arm64-v8a/libproot.so https://github.com/termux/proot/releases/download/v5.1.107/proot-v5.1.107-android-aarch64

        # 3. Minimal bir Linux Rootfs (Alpine arm64) indir ve assets içine at
        echo "Linux Rootfs indiriliyor..."
        curl -L -o app/src/main/assets/rootfs.tar.gz https://github.com/termux/proot-distro/releases/download/v4.15.0/alpine-aarch64-pd-v4.15.0.tar.gz

        # 4. Basit bir build.gradle dosyası oluştur
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 5. App seviyesi build.gradle dosyası oluştur
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.linux.app'
            compileSdk 34
            defaultConfig {
                applicationId 'com.linux.app'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 6. AndroidManifest.xml oluştur
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.linux.app">
            <application
                android:allowBackup="true"
                android:label="LinuxApp"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 7. Basit bir MainActivity.kt oluştur (Açılışta test komutu çalıştırsın)
        cat << 'EOF' > app/src/main/java/com/linux/app/MainActivity.kt
        package com.linux.app
        import android.os.Bundle
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val tv = TextView(this)
                tv.text = "Linux Altyapısı Hazırlanıyor...\n"
                setContentView(tv)

                Thread {
                    val rootfsDir = File(filesDir, "linux_rootfs")
                    if (!rootfsDir.exists()) rootfsDir.mkdirs()
                    
                    runOnUiThread {
                        tv.append("Kök dizin hazır: ${rootfsDir.absolutePath}\n")
                        tv.append("PRoot entegre edildi ve çalışmaya hazır!")
                    }
                }.start()
            }
        }
        EOF

        # 8. Gradle ayar dosyaları
        echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
        echo "include ':app'" > settings.gradle

    - name: Gradle Wrapper Oluştur ve İzin Ver
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: APK Derle (Debug)
      run: ./gradlew assembleDebug

    - name: Üretilen APK'yı Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: otomatik-linux-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
